name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests & build Debug APK
        working-directory: constanta-flight-notifier-android/constanta-flight-notifier-android
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAT-Monitorizare-Trafic-CND-v1.4.0-apk
          path: constanta-flight-notifier-android/constanta-flight-notifier-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
